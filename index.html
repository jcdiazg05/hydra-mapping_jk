<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Estudio Hydra Mapping (8 Buffers)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #eee;
    }

    #ui-panel {
      position: fixed;
      top: 15px;
      left: 15px;
      width: 380px;
      background: rgba(15, 15, 20, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    #ui-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
      color: #00ffcc;
    }

    textarea#hydra-code {
      width: 100%;
      height: 180px;
      background: #0a0a0d;
      color: #00ff88;
      border: 1px solid #2a2a35;
      border-radius: 4px;
      padding: 8px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      line-height: 1.4;
      resize: vertical;
      outline: none;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    button, select {
      background: #1f1f29;
      color: #fff;
      border: 1px solid #3d3d4d;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    button:hover { background: #2f2f3d; border-color: #00ffcc; }
    button.primary { background: #007a63; border-color: #00ffcc; font-weight: bold; }
    button.primary:hover { background: #009e80; }
    button.danger:hover { border-color: #ff4466; color: #ff4466; }

    #surfaces-list {
      margin-top: 10px;
      max-height: 150px;
      overflow-y: auto;
      border-top: 1px solid #2a2a35;
      padding-top: 8px;
    }

    .surface-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #16161d;
      padding: 5px 8px;
      margin-bottom: 5px;
      border-radius: 4px;
      font-size: 12px;
    }

    .shortcuts {
      margin-top: 10px;
      font-size: 11px;
      color: #888;
      line-height: 1.5;
      border-top: 1px solid #2a2a35;
      padding-top: 6px;
    }
    .shortcuts b { color: #ccc; }
  </style>
</head>
<body>

  <div id="ui-panel">
    <div id="ui-header">
      <span>HYDRA MAPPING (o0 - o7)</span>
      <span id="status-badge" style="color:#00ff88; font-size:11px;">● Iniciando...</span>
    </div>

    <textarea id="hydra-code" spellcheck="false"></textarea>

    <div class="toolbar">
      <button class="primary" onclick="runHydraCode()">▶ Ejecutar (Ctrl+Enter)</button>
      <button onclick="addSurface()">+ Superficie</button>
      <button onclick="toggleCalibration()" id="btn-calib">Calibrar: ON</button>
      <button onclick="resetAll()" class="danger">Reset</button>
    </div>

    <div id="surfaces-list"></div>

    <div class="shortcuts">
      <b>Atajos:</b> [<b>C</b>] Calibrar | [<b>H</b>] Ocultar Panel | [<b>F11</b>] Pantalla Completa
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/hydra-synth@1.3.29/dist/hydra-synth.js"></script>

  <script>
    const DEFAULT_CODE = `// Banco 1 (o0 - o3)
osc(15, 0.1, 0.8).rotate(0.4).kaleid(4).out(o0)
voronoi(6, 0.3, 0.5).color(0.1, 0.7, 1).out(o1)
noise(3, 0.2).posterize(4).color(1, 0.2, 0.5).out(o2)
gradient(1).rotate(() => time * 0.5).out(o3)

// Banco 2 (o4 - o7)
shape(4, 0.5, 0.01).repeat(3, 3).out(o4)
osc(30, 0.05).thresh(0.5).out(o5)
noise(8).color(0.2, 1, 0.4).out(o6)
voronoi(12, 0.8).invert().out(o7)`;

    // Mapeo de cada buffer a su instancia (1 o 2) y coordenadas UV
    const BUFFER_MAP = {
      o0: { tex: 1, uv: [0.0, 0.0, 0.5, 0.5] },
      o1: { tex: 1, uv: [0.5, 0.0, 1.0, 0.5] },
      o2: { tex: 1, uv: [0.0, 0.5, 0.5, 1.0] },
      o3: { tex: 1, uv: [0.5, 0.5, 1.0, 1.0] },
      o4: { tex: 2, uv: [0.0, 0.0, 0.5, 0.5] },
      o5: { tex: 2, uv: [0.5, 0.0, 1.0, 0.5] },
      o6: { tex: 2, uv: [0.0, 0.5, 0.5, 1.0] },
      o7: { tex: 2, uv: [0.5, 0.5, 1.0, 1.0] }
    };

    let surfaces = [];
    let calibrating = true;
    let selectedPoint = null;
    let hydraCanvas1, hydraCanvas2;
    let hydra1, hydra2;

    window.addEventListener("DOMContentLoaded", () => {
      // Canvas oculto 1 (o0 - o3)
      hydraCanvas1 = document.createElement("canvas");
      hydraCanvas1.width = 1280;
      hydraCanvas1.height = 720;
      hydraCanvas1.style.display = "none";
      document.body.appendChild(hydraCanvas1);

      // Canvas oculto 2 (o4 - o7)
      hydraCanvas2 = document.createElement("canvas");
      hydraCanvas2.width = 1280;
      hydraCanvas2.height = 720;
      hydraCanvas2.style.display = "none";
      document.body.appendChild(hydraCanvas2);

      // Instancia 1 en modo global
      hydra1 = new Hydra({
        canvas: hydraCanvas1,
        detectAudio: false,
        makeGlobal: true
      });

      // Instancia 2 aislada para aportar o4 - o7
      hydra2 = new Hydra({
        canvas: hydraCanvas2,
        detectAudio: false,
        makeGlobal: false
      });

      // Exportar funciones de Hydra 1 a window
      const synth1 = hydra1.synth || hydra1;
      Object.getOwnPropertyNames(synth1).forEach((key) => {
        window[key] = typeof synth1[key] === "function" ? synth1[key].bind(synth1) : synth1[key];
      });
      const proto1 = Object.getPrototypeOf(synth1);
      if (proto1) {
        Object.getOwnPropertyNames(proto1).forEach((key) => {
          if (key !== "constructor" && typeof synth1[key] === "function") {
            window[key] = synth1[key].bind(synth1);
          }
        });
      }

      // Asignar o4, o5, o6, o7 apuntando a la segunda instancia
      const synth2 = hydra2.synth || hydra2;
      window.o4 = synth2.o0;
      window.o5 = synth2.o1;
      window.o6 = synth2.o2;
      window.o7 = synth2.o3;

      window.loadScript = (url) => {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = url;
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });
      };

      // Iniciar p5.js
      new p5((p) => {
        let gfx1, gfx2;

        p.setup = () => {
          p.createCanvas(p.windowWidth, p.windowHeight, p.WEBGL);
          gfx1 = p.createGraphics(1280, 720);
          gfx2 = p.createGraphics(1280, 720);
          p.textureMode(p.NORMAL);
          loadState();
          runHydraCode();
        };

        p.draw = () => {
          p.background(0);
          p.translate(-p.width / 2, -p.height / 2);

          gfx1.drawingContext.drawImage(hydraCanvas1, 0, 0, 1280, 720);
          gfx2.drawingContext.drawImage(hydraCanvas2, 0, 0, 1280, 720);

          surfaces.forEach((s) => {
            const info = BUFFER_MAP[s.buffer] || BUFFER_MAP.o0;
            const uv = info.uv;

            p.noStroke();
            p.texture(info.tex === 1 ? gfx1 : gfx2);
            p.beginShape();
            p.vertex(s.pts[0].x, s.pts[0].y, uv[0], uv[1]);
            p.vertex(s.pts[1].x, s.pts[1].y, uv[2], uv[1]);
            p.vertex(s.pts[2].x, s.pts[2].y, uv[2], uv[3]);
            p.vertex(s.pts[3].x, s.pts[3].y, uv[0], uv[3]);
            p.endShape(p.CLOSE);

            if (calibrating) {
              p.noFill();
              p.stroke(0, 255, 204);
              p.strokeWeight(1.5);
              p.beginShape();
              s.pts.forEach(pt => p.vertex(pt.x, pt.y));
              p.endShape(p.CLOSE);

              s.pts.forEach((pt, pIdx) => {
                p.fill(pIdx === 0 ? "#ff0066" : "#00ffcc");
                p.noStroke();
                p.ellipse(pt.x, pt.y, 14, 14);
              });
            }
          });
        };

        p.windowResized = () => {
          p.resizeCanvas(p.windowWidth, p.windowHeight);
        };

        p.mousePressed = () => {
          if (!calibrating) return;
          for (let s of surfaces) {
            for (let pt of s.pts) {
              if (p.dist(p.mouseX, p.mouseY, pt.x, pt.y) < 15) {
                selectedPoint = pt;
                return;
              }
            }
          }
        };

        p.mouseDragged = () => {
          if (selectedPoint) {
            selectedPoint.x = p.mouseX;
            selectedPoint.y = p.mouseY;
          }
        };

        p.mouseReleased = () => {
          if (selectedPoint) {
            selectedPoint = null;
            saveSurfaces();
          }
        };
      });
    });

    async function runHydraCode() {
      const code = document.getElementById("hydra-code").value;
      localStorage.setItem("my_hydra_code_8buf", code);
      try {
        await eval(`(async () => { ${code} })()`);
        // Forzar renderizado en cuadrícula 2x2 en ambas instancias
        if (hydra1 && hydra1.synth) hydra1.synth.render();
        if (hydra2 && hydra2.synth) hydra2.synth.render();
        updateStatus("● Código ejecutado", "#00ff88");
      } catch (err) {
        console.error("Detalle del error Hydra:", err);
        updateStatus(`● Error: ${err.message}`, "#ff4466");
      }
    }

    function updateStatus(text, color) {
      const badge = document.getElementById("status-badge");
      badge.innerText = text;
      badge.style.color = color;
    }

    function loadState() {
      const savedCode = localStorage.getItem("my_hydra_code_8buf");
      document.getElementById("hydra-code").value = savedCode || DEFAULT_CODE;

      const savedSurfaces = localStorage.getItem("my_hydra_surfaces_8buf");
      if (savedSurfaces) {
        surfaces = JSON.parse(savedSurfaces);
      } else {
        surfaces = [
          {
            id: Date.now(),
            buffer: "o0",
            pts: [{x: 450, y: 120}, {x: 750, y: 120}, {x: 750, y: 420}, {x: 450, y: 420}]
          },
          {
            id: Date.now() + 1,
            buffer: "o4",
            pts: [{x: 800, y: 150}, {x: 1100, y: 100}, {x: 1100, y: 450}, {x: 800, y: 400}]
          }
        ];
      }
      renderSurfaceUI();
    }

    function saveSurfaces() {
      localStorage.setItem("my_hydra_surfaces_8buf", JSON.stringify(surfaces));
    }

    function addSurface() {
      const buffers = ["o0", "o1", "o2", "o3", "o4", "o5", "o6", "o7"];
      const nextBuffer = buffers[surfaces.length % 8];
      const offset = (surfaces.length * 30) % 200;

      surfaces.push({
        id: Date.now(),
        buffer: nextBuffer,
        pts: [
          {x: 500 + offset, y: 200 + offset},
          {x: 750 + offset, y: 200 + offset},
          {x: 750 + offset, y: 450 + offset},
          {x: 500 + offset, y: 450 + offset}
        ]
      });
      saveSurfaces();
      renderSurfaceUI();
    }

    function removeSurface(id) {
      surfaces = surfaces.filter(s => s.id !== id);
      saveSurfaces();
      renderSurfaceUI();
    }

    function changeSurfaceBuffer(id, newBuffer) {
      const s = surfaces.find(item => item.id === id);
      if (s) {
        s.buffer = newBuffer;
        saveSurfaces();
      }
    }

    function renderSurfaceUI() {
      const container = document.getElementById("surfaces-list");
      container.innerHTML = "";
      const allBuffers = ["o0", "o1", "o2", "o3", "o4", "o5", "o6", "o7"];
      
      surfaces.forEach((s, index) => {
        const div = document.createElement("div");
        div.className = "surface-item";
        const optionsHtml = allBuffers.map(b => 
          `<option value="${b}" ${s.buffer === b ? 'selected' : ''}>Buffer ${b}</option>`
        ).join("");

        div.innerHTML = `
          <span>Cara #${index + 1}</span>
          <div>
            <select onchange="changeSurfaceBuffer(${s.id}, this.value)">
              ${optionsHtml}
            </select>
            <button class="danger" onclick="removeSurface(${s.id})" style="padding:2px 6px; margin-left:4px;">✕</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function toggleCalibration() {
      calibrating = !calibrating;
      document.getElementById("btn-calib").innerText = `Calibrar: ${calibrating ? 'ON' : 'OFF'}`;
    }

    function resetAll() {
      if (confirm("¿Restaurar código y posiciones iniciales?")) {
        localStorage.removeItem("my_hydra_code_8buf");
        localStorage.removeItem("my_hydra_surfaces_8buf");
        location.reload();
      }
    }

    document.getElementById("hydra-code").addEventListener("keydown", (e) => {
      if (e.ctrlKey && e.key === "Enter") {
        e.preventDefault();
        runHydraCode();
      }
    });

    window.addEventListener("keydown", (e) => {
      if (document.activeElement.tagName === "TEXTAREA") return;
      if (e.key.toLowerCase() === "c") toggleCalibration();
      if (e.key.toLowerCase() === "h") {
        const panel = document.getElementById("ui-panel");
        panel.style.display = panel.style.display === "none" ? "block" : "none";
      }
    });
  </script>
</body>
</html>
