<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Estudio Hydra Mapping (Polígonos Libres)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #eee;
    }

    #ui-panel {
      position: fixed;
      top: 15px;
      left: 15px;
      width: 400px;
      background: rgba(15, 15, 20, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    #ui-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
      color: #00ffcc;
    }

    textarea#hydra-code {
      width: 100%;
      height: 170px;
      background: #0a0a0d;
      color: #00ff88;
      border: 1px solid #2a2a35;
      border-radius: 4px;
      padding: 8px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      line-height: 1.4;
      resize: vertical;
      outline: none;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }

    button, select {
      background: #1f1f29;
      color: #fff;
      border: 1px solid #3d3d4d;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    button:hover { background: #2f2f3d; border-color: #00ffcc; }
    button.primary { background: #007a63; border-color: #00ffcc; font-weight: bold; }
    button.primary:hover { background: #009e80; }
    button.danger:hover { border-color: #ff4466; color: #ff4466; }

    #surfaces-list {
      margin-top: 10px;
      max-height: 150px;
      overflow-y: auto;
      border-top: 1px solid #2a2a35;
      padding-top: 8px;
    }

    .surface-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #16161d;
      padding: 5px 8px;
      margin-bottom: 5px;
      border-radius: 4px;
      font-size: 11px;
    }

    .shortcuts {
      margin-top: 8px;
      font-size: 11px;
      color: #888;
      line-height: 1.5;
      border-top: 1px solid #2a2a35;
      padding-top: 6px;
    }
    .shortcuts b { color: #ccc; }
  </style>
</head>
<body>

  <div id="ui-panel">
    <div id="ui-header">
      <span>HYDRA MAPPING STUDIO (N-GON)</span>
      <span id="status-badge" style="color:#00ff88; font-size:11px;">● Iniciando...</span>
    </div>

    <textarea id="hydra-code" spellcheck="false"></textarea>

    <div class="toolbar">
      <button class="primary" onclick="runHydraCode()">▶ Ejecutar</button>
      <button onclick="addPolygon(3)">+ Triángulo</button>
      <button onclick="addPolygon(4)">+ Cuadrado</button>
      <button onclick="addPolygon(5)">+ Pentágono</button>
      <button onclick="addPolygon(6)">+ Hexágono</button>
      <button onclick="toggleCalibration()" id="btn-calib">Calibrar: ON</button>
      <button onclick="resetAll()" class="danger">Reset</button>
    </div>

    <div id="surfaces-list"></div>

    <div class="shortcuts">
      <b>Controles:</b> Arrastra puntos para deformar | <b>[+V]</b> Añade esquina | <b>[-V]</b> Quita esquina | <b>[C]</b> Calibrar | <b>[H]</b> Ocultar Panel
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/hydra-synth@1.3.29/dist/hydra-synth.js"></script>

  <script>
    const DEFAULT_CODE = `s0.initImage("b8ced262-375a-437b-97a1-13f5ba0d1c6c.png")
src(s0)
.out(o0)

speed = 0.6
noise(11)
.rotate(12, 0.9)
//.kaleid(7)
.invert(2)
.repeat(5,3)
.brightness(0.5)
//.posterize(-10,0.4)
.scrollY(7,0.1)
.scrollX(3,0.1)
.colorama(2.9)
.kaleid(2)
.saturate(1.7)
//.pixelate(1000,500)
.hue(8)
.scroll(12,12,0.1,0.1)
.kaleid(8)
.rotate( () => time%360)
.color(0,0.8,0.4)
.out(o1)

voronoi(10,3,1)
.colorama([0.9,0.5,0.7])
.kaleid([4,4,10])
.modulate(osc(5),3)
.scrollY(3,0.3).scrollX(2,0.2)
.kaleid(4)
.rotate(()=> time%360)
.hue(() => Math.sin(time))
.out(o2)

gradient(1)
.kaleid(1)
.modulatePixelate(noise(10,1),)
.out(o3)

shape([3,5,7],()=>a.fft[0])
.color(()=>a.fft[2],()=>a.fft[3],()=>a.fft[1])
.modulate(noise(()=>a.fft[1]))
.diff(o4)
.modulateHue(src(o4).scale(1.01),10)
.kaleid([2,3,1,2],()=>a.fft[0])
.out(o4)

gradient()
.modulateHue(src(o0).scale(1),1)
.repeat(
  () => 10 * Math.tan(time * 0.2),
  () => 2 * Math.sqrt(4)
)
.kaleid(
  () => Math.round()
)
.kaleid(
  () => Math.exp(2))
.colorama(
  () => Math.floor(time * 2))
.modulate(osc(70,0.2))
.modulateHue(src(o5).scale(1),1)
.out(o5)`;

    const DEFAULT_SURFACES = [
      {
        id: 1795383500289,
        buffer: "o2",
        pts: [
          { x: 907, y: 327 },
          { x: 908, y: 409 },
          { x: 986, y: 709 },
          { x: 529, y: 708 },
          { x: 667, y: 500 }
        ]
      },
      {
        id: 1795383561203,
        buffer: "o1",
        pts: [
          { x: 355, y: 377 },
          { x: 599, y: 370 },
          { x: 606, y: 413 },
          { x: 669, y: 500 },
          { x: 529, y: 707 }
        ]
      },
      {
        id: 1795383614321,
        buffer: "o6",
        pts: [
          { x: 530, y: 81 },
          { x: 663, y: 267 },
          { x: 600, y: 333 },
          { x: 599, y: 371 },
          { x: 354, y: 378 },
          { x: 44, y: 116 }
        ]
      },
      {
        id: 1795383706355,
        buffer: "o3",
        pts: [
          { x: 962, y: 84 },
          { x: 1466, y: 117 },
          { x: 1201, y: 382 },
          { x: 908, y: 365 },
          { x: 905, y: 325 }
        ]
      },
      {
        id: 1795383742234,
        buffer: "o4",
        pts: [
          { x: 908, y: 365 },
          { x: 1202, y: 382 },
          { x: 1477, y: 596 },
          { x: 986, y: 711 },
          { x: 853, y: 499 }
        ]
      },
      {
        id: 1795384803320,
        buffer: "o0",
        pts: [
          { x: 962, y: 370 },
          { x: 878, y: 537 },
          { x: 648, y: 533 },
          { x: 556, y: 372 },
          { x: 648, y: 243 }
        ]
      }
    ];

    const BUFFER_MAP = {
      o0: { tex: 1, uv: [0.0, 0.0, 0.5, 0.5] },
      o1: { tex: 1, uv: [0.5, 0.0, 1.0, 0.5] },
      o2: { tex: 1, uv: [0.0, 0.5, 0.5, 1.0] },
      o3: { tex: 1, uv: [0.5, 0.5, 1.0, 1.0] },
      o4: { tex: 2, uv: [0.0, 0.0, 0.5, 0.5] },
      o5: { tex: 2, uv: [0.5, 0.0, 1.0, 0.5] },
      o6: { tex: 2, uv: [0.0, 0.5, 0.5, 1.0] },
      o7: { tex: 2, uv: [0.5, 0.5, 1.0, 1.0] }
    };

    let surfaces = [];
    let calibrating = true;
    let selectedPoint = null;
    let hydraCanvas1, hydraCanvas2;
    let hydra1, hydra2;

    window.mouse = { x: 0, y: 0 };
    window.addEventListener("mousemove", (e) => {
      window.mouse.x = e.clientX;
      window.mouse.y = e.clientY;
    });

    window.addEventListener("DOMContentLoaded", () => {
      hydraCanvas1 = document.createElement("canvas");
      hydraCanvas1.width = 1280; hydraCanvas1.height = 720;
      hydraCanvas1.style.display = "none";
      document.body.appendChild(hydraCanvas1);

      hydraCanvas2 = document.createElement("canvas");
      hydraCanvas2.width = 1280; hydraCanvas2.height = 720;
      hydraCanvas2.style.display = "none";
      document.body.appendChild(hydraCanvas2);

      hydra1 = new Hydra({ canvas: hydraCanvas1, detectAudio: false, makeGlobal: true });
      hydra2 = new Hydra({ canvas: hydraCanvas2, detectAudio: false, makeGlobal: false });

      const synth1 = hydra1.synth || hydra1;
      Object.getOwnPropertyNames(synth1).forEach((key) => {
        window[key] = typeof synth1[key] === "function" ? synth1[key].bind(synth1) : synth1[key];
      });
      const proto1 = Object.getPrototypeOf(synth1);
      if (proto1) {
        Object.getOwnPropertyNames(proto1).forEach((key) => {
          if (key !== "constructor" && typeof synth1[key] === "function") {
            window[key] = synth1[key].bind(synth1);
          }
        });
      }

      const synth2 = hydra2.synth || hydra2;
      window.o4 = synth2.o0;
      window.o5 = synth2.o1;
      window.o6 = synth2.o2;
      window.o7 = synth2.o3;

      window.loadScript = (url) => {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = url;
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });
      };

      new p5((p) => {
        let gfx1, gfx2;

        p.setup = () => {
          p.createCanvas(p.windowWidth, p.windowHeight, p.WEBGL);
          gfx1 = p.createGraphics(1280, 720);
          gfx2 = p.createGraphics(1280, 720);
          p.textureMode(p.NORMAL);
          loadState();
          runHydraCode();
        };

        p.draw = () => {
          p.background(0);
          p.translate(-p.width / 2, -p.height / 2);

          gfx1.drawingContext.drawImage(hydraCanvas1, 0, 0, 1280, 720);
          gfx2.drawingContext.drawImage(hydraCanvas2, 0, 0, 1280, 720);

          surfaces.forEach((s) => {
            if (s.pts.length < 3) return;
            const info = BUFFER_MAP[s.buffer] || BUFFER_MAP.o0;
            const uv = info.uv;

            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            s.pts.forEach(pt => {
              if (pt.x < minX) minX = pt.x;
              if (pt.x > maxX) maxX = pt.x;
              if (pt.y < minY) minY = pt.y;
              if (pt.y > maxY) maxY = pt.y;
            });
            const spanX = (maxX - minX) || 1;
            const spanY = (maxY - minY) || 1;

            p.noStroke();
            p.texture(info.tex === 1 ? gfx1 : gfx2);
            p.beginShape();
            s.pts.forEach(pt => {
              const normX = (pt.x - minX) / spanX;
              const normY = (pt.y - minY) / spanY;
              const u = uv[0] + normX * (uv[2] - uv[0]);
              const v = uv[1] + normY * (uv[3] - uv[1]);
              p.vertex(pt.x, pt.y, u, v);
            });
            p.endShape(p.CLOSE);

            if (calibrating) {
              p.noFill();
              p.stroke(0, 255, 204);
              p.strokeWeight(1.5);
              p.beginShape();
              s.pts.forEach(pt => p.vertex(pt.x, pt.y));
              p.endShape(p.CLOSE);

              s.pts.forEach((pt, pIdx) => {
                p.fill(pIdx === 0 ? "#ff0066" : "#00ffcc");
                p.noStroke();
                p.ellipse(pt.x, pt.y, 13, 13);
              });
            }
          });
        };

        p.windowResized = () => p.resizeCanvas(p.windowWidth, p.windowHeight);

        p.mousePressed = () => {
          if (!calibrating) return;
          for (let s of surfaces) {
            for (let pt of s.pts) {
              if (p.dist(p.mouseX, p.mouseY, pt.x, pt.y) < 15) {
                selectedPoint = pt;
                return;
              }
            }
          }
        };

        p.mouseDragged = () => {
          if (selectedPoint) {
            selectedPoint.x = p.mouseX;
            selectedPoint.y = p.mouseY;
          }
        };

        p.mouseReleased = () => {
          if (selectedPoint) {
            selectedPoint = null;
            saveSurfaces();
          }
        };
      });
    });

    async function runHydraCode() {
      const code = document.getElementById("hydra-code").value;
      localStorage.setItem("my_hydra_code_ngon", code);
      try {
        await eval(`(async () => { ${code} })()`);
        if (hydra1 && hydra1.synth) hydra1.synth.render();
        if (hydra2 && hydra2.synth) hydra2.synth.render();
        updateStatus("● Código ejecutado", "#00ff88");
      } catch (err) {
        console.error("Detalle del error Hydra:", err);
        updateStatus(`● Error: ${err.message}`, "#ff4466");
      }
    }

    function updateStatus(text, color) {
      const badge = document.getElementById("status-badge");
      badge.innerText = text;
      badge.style.color = color;
    }

    function createRegularPolygon(sides, centerX, centerY, radius) {
      const pts = [];
      for (let i = 0; i < sides; i++) {
        const angle = (Math.PI * 2 * i) / sides - Math.PI / 2;
        pts.push({
          x: Math.round(centerX + Math.cos(angle) * radius),
          y: Math.round(centerY + Math.sin(angle) * radius)
        });
      }
      return pts;
    }

    function addPolygon(sides) {
      const buffers = ["o0", "o1", "o2", "o3", "o4", "o5", "o6", "o7"];
      const nextBuffer = buffers[surfaces.length % 8];
      const offset = (surfaces.length * 35) % 250;

      surfaces.push({
        id: Date.now(),
        buffer: nextBuffer,
        pts: createRegularPolygon(sides, 650 + offset, 350 + offset, 130)
      });
      saveSurfaces();
      renderSurfaceUI();
    }

    function addVertexToSurface(id) {
      const s = surfaces.find(item => item.id === id);
      if (!s) return;
      const last = s.pts[s.pts.length - 1];
      const first = s.pts[0];
      s.pts.push({
        x: Math.round((last.x + first.x) / 2) + 15,
        y: Math.round((last.y + first.y) / 2) + 15
      });
      saveSurfaces();
      renderSurfaceUI();
    }

    function removeVertexFromSurface(id) {
      const s = surfaces.find(item => item.id === id);
      if (!s || s.pts.length <= 3) return;
      s.pts.pop();
      saveSurfaces();
      renderSurfaceUI();
    }

    function cloneSurfaces(data) {
      return JSON.parse(JSON.stringify(data));
    }

    function loadState() {
      const savedCode = localStorage.getItem("my_hydra_code_ngon");
      document.getElementById("hydra-code").value = savedCode || DEFAULT_CODE;

      const savedSurfaces = localStorage.getItem("my_hydra_surfaces_ngon");
      if (savedSurfaces) {
        try {
          surfaces = JSON.parse(savedSurfaces);
        } catch (err) {
          surfaces = cloneSurfaces(DEFAULT_SURFACES);
        }
      } else {
        surfaces = cloneSurfaces(DEFAULT_SURFACES);
        saveSurfaces();
      }
      renderSurfaceUI();
    }

    function saveSurfaces() {
      localStorage.setItem("my_hydra_surfaces_ngon", JSON.stringify(surfaces));
    }

    function removeSurface(id) {
      surfaces = surfaces.filter(s => s.id !== id);
      saveSurfaces();
      renderSurfaceUI();
    }

    function changeSurfaceBuffer(id, newBuffer) {
      const s = surfaces.find(item => item.id === id);
      if (s) {
        s.buffer = newBuffer;
        saveSurfaces();
      }
    }

    function renderSurfaceUI() {
      const container = document.getElementById("surfaces-list");
      container.innerHTML = "";
      const allBuffers = ["o0", "o1", "o2", "o3", "o4", "o5", "o6", "o7"];
      
      surfaces.forEach((s, index) => {
        const div = document.createElement("div");
        div.className = "surface-item";
        const optionsHtml = allBuffers.map(b => 
          `<option value="${b}" ${s.buffer === b ? 'selected' : ''}>${b}</option>`
        ).join("");

        div.innerHTML = `
          <span>#${index + 1} (${s.pts.length} esq.)</span>
          <div>
            <button onclick="addVertexToSurface(${s.id})" title="Añadir esquina">+V</button>
            <button onclick="removeVertexFromSurface(${s.id})" title="Quitar esquina">-V</button>
            <select onchange="changeSurfaceBuffer(${s.id}, this.value)">
              ${optionsHtml}
            </select>
            <button class="danger" onclick="removeSurface(${s.id})" style="padding:3px 6px;">✕</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function toggleCalibration() {
      calibrating = !calibrating;
      document.getElementById("btn-calib").innerText = `Calibrar: ${calibrating ? 'ON' : 'OFF'}`;
    }

    function resetAll() {
      if (confirm("¿Restaurar código y figuras iniciales?")) {
        localStorage.removeItem("my_hydra_code_ngon");
        localStorage.removeItem("my_hydra_surfaces_ngon");
        location.reload();
      }
    }

    document.getElementById("hydra-code").addEventListener("keydown", (e) => {
      if (e.ctrlKey && e.key === "Enter") {
        e.preventDefault();
        runHydraCode();
      }
    });

    window.addEventListener("keydown", (e) => {
      if (document.activeElement.tagName === "TEXTAREA") return;
      if (e.key.toLowerCase() === "c") toggleCalibration();
      if (e.key.toLowerCase() === "h") {
        const panel = document.getElementById("ui-panel");
        panel.style.display = panel.style.display === "none" ? "block" : "none";
      }
    });
  </script>
</body>
</html>
